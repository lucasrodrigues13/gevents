# Uso local. A senha do banco vale só nesta rede interna: a porta do PostgreSQL não é publicada.
# O Caddy publica o build estático e encaminha /api. A API não aplica migration ao subir.

name: gevents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gevents
      POSTGRES_PASSWORD: gevents
      POSTGRES_DB: gevents
    volumes:
      - banco:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gevents -d gevents"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: gevents
      PGHOST: postgres
      PGUSER: gevents
      PGDATABASE: gevents
    volumes:
      - ./deploy/schema.sql:/schema.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/Project.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=gevents;Username=gevents;Password=gevents
      # Segredo só desta stack local. Em produção vem de variável de ambiente e não entra no git.
      Jwt__Secret: local-apenas-gevents-jwt-segredo-32
      Jwt__Issuer: gevents
      Jwt__Audience: gevents
      Jwt__ExpiryHours: "8"
      DataProtection__KeysPath: /keys
      PublicUrl: http://localhost:8080
      Bootstrap__Enabled: "false"
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__1: 10.0.0.0/8
      ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
    volumes:
      - storage:/storage
      - chaves:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interna

volumes:
  banco:
  storage:
  chaves:

networks:
  interna:
